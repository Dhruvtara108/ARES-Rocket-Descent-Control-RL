; ARES Rover ESP32-CAM firmware (AI-Thinker ESP32-CAM, OV3660)
; Host unit tests for the portable modules: make -C test/host

[env:esp32cam]
platform = espressif32 @ ~6.5.0
board = esp32cam
framework = arduino
monitor_speed = 115200
upload_speed = 460800
monitor_filters = esp32_exception_decoder
build_flags =
    -I include
    -DBOARD_HAS_PSRAM
    -mfix-esp32-psram-cache-issue
    -Wall
